<!DOCTYPE html>
<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>흥정왕 전당포</title>

<style>
/* VOICE: 시끌벅적한 동네 전당포, 만화 같은 손님들

   PICTURE: 줄무늬 벽지, 진열장, 나무 카운터 위 소품, 개성 있는 손님 전신
   COLOUR and TYPE: 와인 벽지 #7a2e2a / 나무 #6b4126 / 놋쇠 #d9a441, Do Hyeon 제목 + Gaegu 손글씨
   LAYOUT: 400x820 무대 하나를 화면에 맞춰 확대, 오버레이는 신문·장부·코르크보드·영수증 같은 실물 */
:root{color-scheme:light dark;--bg:#2a1712;--ink:#1e1612;--paper:#f6eedd;--brass:#d9a441;--teal:#1f8a86;--bad:#c4402a;--good:#2f8a4a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#4a2a20,#1a0e0a);overflow:hidden;font:16px/1.5 "Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:manipulation}
[data-act]{cursor:pointer}
[data-act]:focus{outline:none}[data-act]:focus-visible{outline:3px solid #ffd77a}
.hot{transition:transform .12s}
.hot:active{transform:translateY(2px)}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(200px,250px)}50%{transform:translate(200px,254px)}}
.blink{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.steam{animation:steam 1.2s ease-out infinite;opacity:0}
@keyframes steam{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-22px)}}
.shake{animation:shake .4s 2}
@keyframes shake{0%,100%{transform:translate(200px,250px)}25%{transform:translate(193px,250px)}75%{transform:translate(207px,250px)}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.1}}
.pop{animation:pop .25s ease-out;transform-box:fill-box;transform-origin:bottom center}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.bob,.blink,.steam,.shake,.glow,.pop{animation:none}.steam{opacity:.6}}
/* overlays */
.modal{position:fixed;inset:0;z-index:10;background:rgba(15,6,3,.62);display:flex;align-items:center;justify-content:center;padding:12px}
.modal.hidden{display:none}
.sheet{width:min(560px,100%);max-height:94vh;overflow:auto;border-radius:6px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.55);position:relative}
.sheet h2{font:30px/1.1 "Do Hyeon",sans-serif;margin:0 0 8px}
.sheet h3{font:21px/1.2 "Do Hyeon",sans-serif;margin:0 0 4px}
.note{font-size:14px;opacity:.8}
.hand{font-family:"Gaegu",cursive;font-size:19px;line-height:1.3}
.paper{background:#f3ead4;color:#1d1915;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 2px,transparent 2px 4px)}
.mast{text-align:center;border-bottom:3px double #1d1915;padding-bottom:6px;margin-bottom:10px}
.mast b{font:40px/1 "Do Hyeon",sans-serif;display:block}.mast span{font-size:13px}
.head{font:26px/1.2 "Do Hyeon",sans-serif;margin:6px 0}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border-top:1px solid #1d1915;padding-top:8px;font-size:15px}
.cols p{margin:4px 0}
.up{color:#1d7a3a;font-weight:700}.dn{color:#b0301e;font-weight:700}
.ledger{background:#fbf6e9;color:#22201c;background-image:linear-gradient(90deg,transparent 38px,#e8a0a0 38px 40px,transparent 40px),repeating-linear-gradient(0deg,transparent 0 27px,#bcd3e6 27px 28px);padding-left:52px;border-left:10px solid #5a2a1c}

.receipt{width:min(360px,100%);background:#fffdf6;color:#222;font:15px/1.5 "Noto Sans KR",monospace;border-radius:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),95% 100%,90% calc(100% - 10px),85% 100%,80% calc(100% - 10px),75% 100%,70% calc(100% - 10px),65% 100%,60% calc(100% - 10px),55% 100%,50% calc(100% - 10px),45% 100%,40% calc(100% - 10px),35% 100%,30% calc(100% - 10px),25% 100%,20% calc(100% - 10px),15% 100%,10% calc(100% - 10px),5% 100%,0 calc(100% - 10px));padding-bottom:26px}

.hall{background:#24161a;color:#f6e7d0;border:3px solid #a8823a}
.hall svg{display:block;width:100%;height:auto;border-radius:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.tag{background:#f6eedd;border-radius:4px 14px 14px 4px;padding:10px 12px;box-shadow:0 3px 0 rgba(0,0,0,.3);position:relative}
.tag::before{content:"";position:absolute;left:8px;top:8px;width:9px;height:9px;border-radius:50%;background:#7a4f2c}
.tag .nm{font:20px/1.1 "Do Hyeon",sans-serif;padding-left:14px}
.polar{background:#fff;padding:8px 8px 10px;box-shadow:0 4px 8px rgba(0,0,0,.35);transform:rotate(var(--rot,0deg))}
.polar svg{width:100%;height:auto;max-height:170px;display:block;background:#cfe3e8}
.cork .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr))}
.pin{position:absolute;left:50%;top:-6px;width:14px;height:14px;border-radius:50%;background:#c4402a;box-shadow:0 2px 2px rgba(0,0,0,.4)}
.stamp{min-height:44px;border:3px solid currentColor;border-radius:8px;background:transparent;font:20px/1 "Do Hyeon",sans-serif;padding:6px 14px;color:var(--teal);transform:rotate(-2deg)}
.stamp.red{color:var(--bad)}.stamp.gold{color:#8a5a10}
.stamp:disabled{opacity:.4;cursor:not-allowed}
.btn{min-height:46px;border:0;border-radius:8px;padding:8px 14px;background:#6b4126;color:#fbefd9;font:19px/1 "Do Hyeon",sans-serif;box-shadow:0 3px 0 #3a1f12;cursor:pointer}
.btn.brass{background:var(--brass);color:#2a1a0a;box-shadow:0 3px 0 #8a6420}
.btn.ghost{background:transparent;color:inherit;box-shadow:none;border:2px solid currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1 1 0}
.paddle{display:block;margin:12px auto 0;width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ffe9a8,#d9a441 60%,#a8782a);font:26px/1.1 "Do Hyeon",sans-serif;color:#3a2108;box-shadow:0 6px 0 #6b4a14,0 10px 20px rgba(0,0,0,.5);cursor:pointer}
.paddle:disabled{filter:grayscale(1);opacity:.5}
.log{font-size:14px;max-height:110px;overflow:auto;background:rgba(0,0,0,.3);border-radius:6px;padding:8px;margin-top:10px}
.skill{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px}
.pips{color:#b0301e;letter-spacing:2px}
.close{position:absolute;right:10px;top:8px;width:44px;height:44px;border:0;background:transparent;font:28px/1 "Do Hyeon";color:inherit;cursor:pointer}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) rotate(-1deg);background:#fff6a8;color:#2a1a0a;padding:10px 16px;font:20px/1.2 "Gaegu",cursive;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.4)}
#toast.on{opacity:1}
.pos{color:var(--good)}.neg{color:var(--bad)}
</style>
</head>

function traitLook(L,tr){
 const t=k=>tr.includes(k),acc=new Set(L.acc);
 if(t('rich')){acc.add(L.outfit==='coat'?'pearl':'chain');if(!L.glasses&&R()<.5)L.glasses=2}
 if(t('naive')){L.eyes='big';acc.add('blush')}
 if(t('calm'))L.eyes='sleepy';
 if(t('scammer')){L.eyes='shifty';L.hat='fedora';L.fh=1;if(R()<.5){L.outfit='coat';L.oc='#9a8466'}}
 if(t('expert'))L.glasses=1;
 if(t('hasty'))acc.add('sweat');
 if(t('stingy'))acc.add('patch');
 if(t('collector'))acc.add('pins');
 if(t('desperate')){acc.add('bags');acc.add('bandaid')}
 if(t('greedy'))acc.add('goldtooth');
 if(t('proud'))L.brows='proud';
 if(t('chatty'))acc.add('chatty');
 L.acc=[...acc];return L;
}
function genCustomer(){
 const avail=S.inv.filter(i=>!i.restoring);
 S.today.sp=S.today.sp||[];

  const keys=Object.keys(TR).filter(k=>buy?!['desperate','scammer'].includes(k):true);
  const n=R()<.55?1:2;let g=0;

  const ar=pick(ARCH);

  name=pick(SUR)+pick(GIV);role=ar.n;tic=ar.tic;
 }
 const t=k=>tr.includes(k);
 let maxPat=Math.round(100*(t('hasty')?.6:1)*(t('calm')?1.5:1)+S.skills.charm*8);
 const c={name,role,tic,tr,buy,L,sk:spk,rounds:0,last:null,gone:false,res:'',accused:false,mood:'ok'};
 const shown=(has('profiler')||S.skills.psych>=3)?tr.length:S.skills.psych>=1?1:0;
 c.seen=tr.slice(0,shown);
 let intro='',minAdj=1;
 const rel=spk&&S.rel[spk];
 if(rel&&rel.last&&sp.cb[rel.last]){intro=sp.cb[rel.last]+' ';
  if(rel.last==='fair')maxPat=Math.round(maxPat*1.25);
  if(rel.last==='steal'||rel.last==='angry'){maxPat=Math.round(maxPat*.8);minAdj=1.1}
  if(rel.last==='scam'){maxPat=Math.round(maxPat*.6);minAdj=1.2}}
 else if(sp)intro=sp.hi+' ';
 c.pat=maxPat;c.maxPat=maxPat;
 if(!buy){

  const per=val(it,true)*(t('naive')?.6:1)*(t('expert')?rnd(.95,1.05):rnd(.8,1.2));
  let mr=.72-S.skills.haggle*.025;if(t('desperate'))mr-=.22;if(t('greedy'))mr+=.13;if(t('scammer'))mr-=.15;
  c.min=r10(per*mr*minAdj);c.ask=r10(Math.max(c.min*1.1,per*(t('greedy')?1.3:1.08)*rnd(1.05,1.35)));

function signBoard(act,big,small,bg,fg){
 return hot(act,null,`<g class="pop"><path d="M150 590 L200 562 L250 590" stroke="#c9a227" stroke-width="3" fill="none"/><circle cx="200" cy="560" r="5" fill="url(#brass)"/><g filter="url(#sh)"><rect x="104" y="590" width="192" height="100" rx="10" fill="${bg}"/><rect x="112" y="598" width="176" height="84" rx="6" fill="none" stroke="${fg}" stroke-width="3"/><text x="200" y="640" text-anchor="middle" font-family="Do Hyeon" font-size="32" fill="${fg==='#c4402a'?'#ff8a6a':'#9ac4ff'}">${big}</text><text x="200" y="668" text-anchor="middle" font-family="Gaegu" font-weight="700" font-size="18" fill="#fbe7c9">${small}</text></g></g>`,`${big} 팻말: ${small}`);
}

  const ln=wrap(c.res,15);
  s+=`<text font-family="Do Hyeon" font-size="15" fill="#1e2a14">${ln.slice(0,2).map((l,i)=>`<tspan x="118" y="${634+i*18}">${esc(l)}</tspan>`).join('')}</text>`;

  return s;
 }
 s+=`<text x="116" y="631" font-family="Noto Sans KR" font-size="12" fill="#3a4a2a">${c.buy?'손님 제시':'손님 요구'} ${fmt(their)}${c.last!=null?` · 내 직전 ${fmt(c.last)}`:''}</text>
 <text x="284" y="655" text-anchor="end" font-family="Do Hyeon" font-size="26" fill="#14200c">${fmt(draft)}</text>`;
 const K=[['7','8','9','⌫'],['4','5','6','-10%'],['1','2','3','+10%'],['0','00','C','제시']];
 K.forEach((row,j)=>row.forEach((k,i)=>{
  const x=110+i*46,y=666+j*37,isOk=k==='제시',isOp=i===3||k==='C';
  s+=hot('key',k,`<rect x="${x}" y="${y}" width="42" height="33" rx="6" fill="${isOk?'#1f8a86':isOp?'#5a636e':'#e8e2d4'}"/><rect x="${x}" y="${y+28}" width="42" height="5" rx="2" fill="#000" opacity=".25"/><text x="${x+21}" y="${y+23}" text-anchor="middle" font-family="Do Hyeon" font-size="${k.length>2?15:19}" fill="${isOk||isOp?'#fff':'#1e1612'}">${k}</text>`,k==='제시'?`${fmt(draft)} 제안하기`:k==='⌫'?'한 자리 지우기':k)}));
 return s;
}

/* ================= 오버레이 ================= */
function paperHTML(){const n=S.news;if(!n)return'';const an=has('analyst');
 const pct=k=>{const p=Math.round((trend(k)-1)*100);return`${p>0?'+':''}${p}%`};
 return`<div class="mast"><b>흥정 일보</b><span>${S.day}일차 · 1부 $1 · 단골 할인 없음</span></div>
 <div class="head">${esc(n.head)}</div>
 <div class="cols"><div><b>시세 소식</b><p><span class="up">▲ ${CATS[n.up].n}</span> ${CATS[n.up].up}${an?` (${pct(n.up)})`:''}</p><p><span class="dn">▼ ${CATS[n.dn].n}</span> ${CATS[n.dn].dn}${an?` (${pct(n.dn)})`:''}</p>
 ${an?`<p class="hand">분석가 메모: 내일은 ${CATS[S.next].n}이(가) 뜹니다!</p>`:''}</div>
 <div><b>단신</b>${n.sub.map(s=>`<p>${esc(s)}</p>`).join('')}${S.day===S.auctionDay?`<p><b>[공고] 오늘 시립 경매장 경매. 참가비 ${fmt(aFee())}</b></p>`:`<p>다음 경매: ${S.auctionDay}일차</p>`}</div></div>`}
function showPaper(){modal(`<div class="sheet paper"><button class="close" data-act="close" aria-label="닫기">×</button>${paperHTML()}<button class="btn" style="width:100%;margin-top:12px" data-act="close">신문 내려놓기</button></div>`)}
function showInv(){
 const sorted=[...S.inv].sort((a,b)=>val(b,true)-val(a,true));
 modal(`<div class="sheet crate"><button class="close" data-act="close" aria-label="닫기" style="color:#fbefd9">×</button><h2>창고 ${S.inv.length}/${cap()}</h2><p class="note">사러 온 손님은 여기서 물건을 고릅니다. 도매상은 흥정 없이 바로 사 가지만 실제 가치의 절반만 쳐주고, 가품은 귀신같이 알아봅니다.</p>
 ${sorted.length?`<div class="grid">${sorted.map(it=>{inspect(it);const[lo,hi]=est(it),rc=r10(val(it,true)*.12);
 return`<div class="tag"><div class="nm"><span style="font-size:28px">${it.e}</span> ${esc(it.name)}</div><div style="font-size:14px;margin-top:4px"><b style="color:${RAR[it.r].c}">${RAR[it.r].n}</b> · ${CON[it.c].n} · ${CATS[it.cat].n}${trend(it.cat)>1.12?' <span class="up">▲</span>':trend(it.cat)<.88?' <span class="dn">▼</span>':''}${it.restoring?' · 수리 중':''}${(it.suspect||(it.known&&it.fake))?` · <b class="neg">${it.known?'가품 확정':'가품 의심'}</b>`:''}</div>
 <div class="hand">${it.known?`감정가 ${fmt(val(it,false))}`:`추정 ${fmt(lo)}~${fmt(hi)}`}<br>매입 ${fmt(it.paid)}</div>
 <div class="row" style="margin-top:6px">${!it.known?`<button class="stamp gold" data-act="appr" data-arg="${it.id}">감정 ${fmt(apprFee(it))}</button>`:''}${has('restorer')&&it.c<4&&!it.restoring?`<button class="stamp" data-act="restore" data-arg="${it.id}">수리 ${fmt(rc)}</button>`:''}<button class="stamp red" data-act="dump" data-arg="${it.id}" ${it.restoring?'disabled':''}>도매 처분</button></div></div>`}).join('')}</div>`:'<p class="hand" style="color:#fbefd9">텅 비었다... 손님에게 물건을 사들이자.</p>'}</div>`)}
function showStaff(){const slots=1+S.shop;
 modal(`<div class="sheet cork"><button class="close" data-act="close" aria-label="닫기">×</button><h2 style="background:#f6eedd;display:inline-block;padding:4px 10px;transform:rotate(-1deg)">직원 게시판</h2><p class="hand" style="background:#fff6a8;display:inline-block;padding:4px 10px;margin:6px 0 14px">자리 ${S.staff.length}/${slots} · 가게를 넓히면 자리가 늘어요</p>
 <div class="grid">${Object.entries(STAFF).map(([k,s],i)=>`<div class="polar" style="--rot:${(i%3-1)*2}deg;position:relative"><span class="pin"></span>${portrait(s.L,has(k)?'happy':'ok')}<h3 style="margin-top:6px">${s.pn}</h3><div class="note">${s.n} · 일급 ${fmt(s.w)}</div><p style="font-size:14px;margin:4px 0">${s.d}</p><p class="hand" style="margin:0 0 6px">${s.q}</p>${has(k)?`<button class="stamp red" style="width:100%" data-act="fire" data-arg="${k}">해고</button>`:`<button class="stamp" style="width:100%" data-act="hire" data-arg="${k}" ${S.staff.length>=slots?'disabled':''}>고용</button>`}</div>`).join('')}</div></div>`)}
const SK={haggle:['흥정','판매자는 더 싸게, 구매자는 더 비싸게'],appraise:['감정','추정가가 좁아지고 가품이 보임'],psych:['심리','손님 성향을 읽음 (1레벨 1개, 3레벨 전부)'],charm:['화술','손님 인내심 증가']};
function showLedger(){const nx=SHOPS[S.shop+1];
 modal(`<div class="sheet ledger"><button class="close" data-act="close" aria-label="닫기">×</button><h2>사장 장부</h2>
 <p class="hand">Lv.${S.lv} 딜러 · 경험치 ${S.xp}/${S.lv*120} · 스킬 포인트 <b style="color:#c4402a">${S.sp}</b></p>
 ${Object.entries(SK).map(([k,[n,d]])=>`<div class="skill"><div><b style="font:20px Do Hyeon">${n}</b> <span class="pips">${'●'.repeat(S.skills[k])}${'○'.repeat(5-S.skills[k])}</span><div class="note">${d}</div></div><button class="stamp" data-act="skill" data-arg="${k}" ${!S.sp||S.skills[k]>=5?'disabled':''}>+1</button></div>`).join('')}
 <h3 style="margin-top:14px">가게</h3><p class="hand">지금: ${SHOPS[S.shop].n} · 임대료 ${fmt(SHOPS[S.shop].rent)}/일 · 창고 ${cap()}칸 · 손님 ${SHOPS[S.shop].cust}명</p>
 ${nx?`<p class="note">다음: <b>${nx.n}</b> · 창고 ${nx.st}칸 · 손님 ${nx.cust}명 · 더 비싼 물건과 부자 손님 · 임대료 ${fmt(nx.rent)}/일</p><button class="btn brass" style="width:100%" data-act="move" ${S.money<nx.cost?'disabled':''}>${fmt(nx.cost)}에 이전 계약</button>`:'<p class="hand"><b>최고의 가게! 이 거리의 흥정왕입니다.</b></p>'}
 <h3 style="margin-top:14px">단골 수첩</h3>${Object.keys(S.rel).length?Object.entries(S.rel).map(([k,r])=>`<p class="hand" style="margin:2px 0">${SP[k].n} — 방문 ${r.visits}회, 지난번: ${({steal:'내가 이득',fair:'공정 거래',angry:'화내고 떠남',scam:'가품을 팔았음'})[r.last]||'-'}</p>`).join(''):'<p class="note">아직 단골이 없습니다. ★단골 표시 손님은 지난 거래를 기억합니다.</p>'}
 <p class="note" style="margin-top:12px">누적 거래 ${S.stats.deals}건 · 판매 차익 ${fmt(S.stats.profit)}</p>
 <button class="btn ghost" style="width:100%;margin-top:6px;color:#c4402a" data-act="askreset">처음부터 다시 하기</button></div>`)}

/* ================= 공통 ================= */
function render(){$('#wrap').innerHTML=scene()}
function modal(h){$('#modal').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2300)}
const byId=id=>S.inv.find(i=>i.id===+id)||(S.cur&&S.cur.item&&S.cur.item.id===+id?S.cur.item:null);
function refreshModal(fn){render();fn()}
const ACT={
 close:closeModal,paper:showPaper,inv:showInv,staff:showStaff,ledger:showLedger,receipt:showReceipt,
 trait:k=>{const c=S.cur;toast(c&&c.seen.includes(k)?`${TR[k].n}: ${TR[k].d}`:'심리 스킬이나 프로파일러가 있으면 보입니다')},
 flip:flipOpen,openshop:openShop,
 vpick:i=>{const c=S.cur,v=VIS[c.vk];const[m,txt]=v.opts[+i][1]();c.mood=m;c.msg=txt;c.gone=true;save();render()},
 auction:startAuction,abid:aBid,apass:()=>{if(A.leader==='me')return;endLot()},
 nextlot:()=>{A.i++;startLot()},leaveauc:()=>{A=null;closeModal();render()},
 key:k=>{const c=S.cur;if(!c||c.gone)return;const their=c.buy?c.offer:c.ask;
  if(k==='제시')return propose(draft,false);
  if(k==='⌫')draft=Math.floor(draft/10);else if(k==='C')draft=0;
  else if(k==='-10%')draft=r10((draft||their)*.9);else if(k==='+10%')draft=r10((draft||their)*1.1);
  else draft=Math.min(99999999,+(String(draft||'')+k));
  render()},
 tagset:()=>{const it=curItem(),c=S.cur;if(!it||!c||c.gone)return;const[lo,hi]=est(it);draft=it.known?r10(val(it,false)):c.buy?hi:lo;render()},
 final:()=>propose(draft,true),
 accept:()=>{const c=S.cur;if(!c||c.gone)return;c.buy?dealBuy(c.offer):dealSell(c.ask)},
 refuse:()=>{if(S.cur&&!S.cur.gone)leave(S.cur.buy?'아쉽네요. 다음에 올게요.':'그럼 다른 데 가볼게요.',false)},
 accuse,next:nextCustomer,nextday:nextDay,
 appr:a=>{const it=byId(a);if(it){appraise(it);if(!$('#modal').classList.contains('hidden'))showInv()}},
 restore:a=>{const it=byId(a),c=r10(val(it,true)*.12);if(S.money<c)return toast('돈이 부족해요');S.money-=c;it.restoring=true;toast('내일 아침까지 수리됩니다');save();refreshModal(showInv)},
 dump:a=>{const it=byId(a);if(S.cur&&!S.cur.gone&&S.cur.itemId===it.id)return toast('손님이 보고 있는 물건이에요');const p=r10(val(it,false)*.5);S.money+=p;S.inv=S.inv.filter(i=>i!==it);S.stats.profit+=p-it.paid;toast(`도매상: "${it.name}? ${fmt(p)} 드리죠."`);save();refreshModal(showInv)},
 hire:k=>{S.staff.push(k);toast(`${STAFF[k].pn}: ${STAFF[k].q}`);save();refreshModal(showStaff)},
 fire:k=>{S.staff=S.staff.filter(x=>x!==k);save();refreshModal(showStaff)},
 skill:k=>{if(!S.sp||S.skills[k]>=5)return;S.sp--;S.skills[k]++;save();refreshModal(showLedger)},
 move:()=>{const nx=SHOPS[S.shop+1];if(!nx||S.money<nx.cost)return;S.money-=nx.cost;S.shop++;save();render();
  if(S.shop===SHOPS.length-1&&!S.won){S.won=true;modal(`<div class="sheet paper"><div class="mast"><b>흥정 일보 호외</b></div><div class="head">"${SHOPS[S.shop].n}" 개업! ${S.day}일 만의 신화</div><p>동네 차고에서 시작한 사장, 마침내 흥정왕 등극. 장사는 계속됩니다.</p><button class="btn" style="width:100%" data-act="close">계속하기</button></div>`)}else{toast(`${nx.n}(으)로 이전!`);showLedger()}},
 askreset:()=>modal(`<div class="sheet paper"><h2>처음부터 다시?</h2><p>지금 진행 상황이 사라집니다.</p><div class="row"><button class="btn" style="background:#c4402a" data-act="reset">다시 시작</button><button class="btn ghost" data-act="close">취소</button></div></div>`),
 reset:()=>{S=newGame();A=null;closeModal();startDay()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.arg)});
document.addEventListener('keydown',e=>{
 const b=e.target.closest&&e.target.closest('g[data-act]');
 if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.arg);return}
 if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')&&$('#modal [data-act=close]'))closeModal();
 const c=S&&S.cur;if(!c||c.gone||c.visitor||S.phase!=='open'||!$('#modal').classList.contains('hidden'))return;
 if(/^[0-9]$/.test(e.key))ACT.key(e.key);else if(e.key==='Backspace')ACT.key('⌫');else if(e.key==='Enter')ACT.key('제시');
});

S=load();
if(!S||!S.skills){S=newGame();startDay()}
else{if(S.cur&&!S.cur.gone&&!S.cur.visitor)draft=S.cur.buy?r10(S.cur.offer*1.5):r10(S.cur.ask*.6);render();if(S.phase==='morning')showPaper();else if(S.phase==='night')showReceipt()}
}
</script>
</body>
</html>
